{% extends "base.html" %}
{% block title %}Контакты{% endblock %}
{% block content %}
<section class="wrap narrow">
    <h1>Контакты штаба</h1>
    <p>Письмо сохраняется в базе. Это не обещание круглосуточного оператора.</p>
    <form method="post" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Имя<input name="name" required></label>
        <label>Почта<input type="email" name="email" required></label>
        <label>Сообщение<textarea name="message" required></textarea></label>
        <button class="btn btn-gold" type="submit">Отправить</button>
    </form>
</section>
{% endblock %}
