{% extends "admin/base.html" %}
{% block admin %}
<h1>Плавающая реклама Тишки</h1>
<form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label><input type="checkbox" name="enabled" value="1" {% if enabled == '1' %}checked{% endif %}> Показывать блок</label>
    <label>Текст<textarea name="text">{{ text }}</textarea></label>
    <label>Ссылка<input name="link" value="{{ link }}"></label>
    <button class="btn btn-gold" type="submit">Сохранить показ</button>
</form>
{% endblock %}
